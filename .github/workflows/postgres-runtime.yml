name: SARVEX PostgreSQL Runtime Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "supabase-production-migration.sql"
      - "supabase/tests/**"
      - ".github/workflows/postgres-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "supabase-production-migration.sql"
      - "supabase/tests/**"
      - ".github/workflows/postgres-runtime.yml"

permissions:
  contents: read

concurrency:
  group: sarvex-postgres-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-runtime:
    name: PostgreSQL ${{ matrix.pg }} migration runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap isolated Supabase auth and storage interfaces
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap-supabase.sql

      - name: Apply production migration (first run)
        run: psql -v ON_ERROR_STOP=1 -f supabase-production-migration.sql

      - name: Verify baseline migration security invariants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/baseline-security-smoke.sql

      - name: Reapply production migration (idempotency check)
        run: psql -v ON_ERROR_STOP=1 -f supabase-production-migration.sql

      - name: Verify security invariants after reapplication
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/baseline-security-smoke.sql

      - name: Create isolated legacy-schema upgrade database
        run: createdb sarvex_legacy

      - name: Reproduce existing Live starter schema and rows
        run: |
          psql -d sarvex_legacy -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap-supabase.sql
          psql -d sarvex_legacy -v ON_ERROR_STOP=1 -f supabase/tests/legacy-live-schema-fixture.sql

      - name: Apply migration to legacy schema and preserve existing records
        run: |
          psql -d sarvex_legacy -v ON_ERROR_STOP=1 -f supabase-production-migration.sql
          psql -d sarvex_legacy -v ON_ERROR_STOP=1 -f supabase/tests/baseline-security-smoke.sql
          psql -d sarvex_legacy -v ON_ERROR_STOP=1 -f supabase/tests/legacy-upgrade-smoke.sql

      - name: Reapply migration to legacy schema (idempotency)
        run: |
          psql -d sarvex_legacy -v ON_ERROR_STOP=1 -f supabase-production-migration.sql
          psql -d sarvex_legacy -v ON_ERROR_STOP=1 -f supabase/tests/legacy-upgrade-smoke.sql

      - name: Verify fail-closed RLS and seller KYC policy rejection
        run: bash supabase/tests/security-negative-probes.sh

  live-supabase-readonly:
    name: Optional live Supabase REST connectivity check
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_ANON_KEY != '' }}
    steps:
      - name: Check configured Supabase products endpoint (read-only)
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "Supabase URL must use HTTPS"; exit 1 ;;
          esac
          code=$(curl --silent --show-error --output /tmp/sarvex-products.json --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1")
          if [ "$code" != "200" ]; then
            echo "Supabase REST read failed with HTTP $code"
            exit 1
          fi
          jq -e 'type == "array"' /tmp/sarvex-products.json >/dev/null
          echo "Supabase REST connectivity PASS (read-only products endpoint; no rows or secrets printed)."

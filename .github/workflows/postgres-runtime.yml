name: SARVEX PostgreSQL Runtime Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "supabase-production-migration.sql"
      - "supabase/tests/**"
      - ".github/workflows/postgres-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "supabase-production-migration.sql"
      - "supabase/tests/**"
      - ".github/workflows/postgres-runtime.yml"

permissions:
  contents: read

concurrency:
  group: sarvex-postgres-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-runtime:
    name: PostgreSQL ${{ matrix.pg }} migration runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap isolated Supabase auth and storage interfaces
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap-supabase.sql

      - name: Apply production migration (first run)
        run: psql -v ON_ERROR_STOP=1 -f supabase-production-migration.sql

      - name: Verify baseline migration security invariants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/baseline-security-smoke.sql

      - name: Reapply production migration (idempotency check)
        run: psql -v ON_ERROR_STOP=1 -f supabase-production-migration.sql

      - name: Verify security invariants after reapplication
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/baseline-security-smoke.sql

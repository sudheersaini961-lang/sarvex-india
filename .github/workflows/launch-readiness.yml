name: SARVEX Launch Readiness Checks

on:
  push:
    branches:
      - "fix/launch-readiness-truthful-checkout"
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/launch-readiness.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/launch-readiness.yml"

permissions:
  contents: read

concurrency:
  group: sarvex-launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: TypeScript and production web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production web build
        run: npm run build

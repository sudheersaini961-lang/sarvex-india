name: SARVEX Launch Readiness Checks

on:
  push:
    branches:
      - "fix/launch-readiness-truthful-checkout"
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/launch-readiness.yml"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/launch-readiness.yml"

permissions:
  contents: read

concurrency:
  group: sarvex-launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: TypeScript and production web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production web build
        run: npm run build

  android-debug-apk:
    name: Android debug APK build
    needs: web-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install locked dependencies
        run: npm ci

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify backup archives are not bundled
        run: |
          if find dist android/app/src/main/assets/public -type f -name "*.zip" | grep -q .; then
            echo "Error: Backup ZIP files found in web or Android bundle."
            exit 1
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarvex-india-launch-readiness-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: SARVEX Branch Validation

on:
  push:
    branches:
      - fix/public-seller-sync-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sarvex-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test SARVEX picomatch ReDoS regression cases
        run: node scripts/test-picomatch-redos.cjs

      - name: Enforce complete dependency security audit
        run: npm audit --audit-level=high

      - name: Inspect production dependency path to Vite advisories
        run: npm ls vite fdir picomatch --omit=dev || true

      - name: Enforce production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Archive committed lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: sarvex-patched-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2

      - name: TypeScript check
        run: npm run lint

      - name: Production web build
        run: npm run build

name: SARVEX Branch Validation

on:
  push:
    branches:
      - fix/public-seller-sync-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sarvex-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency security advisories (read-only)
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))"
      - name: Preview non-breaking dependency fixes (no files changed)
        run: |
          npm audit fix --dry-run --json > npm-audit-fix-preview.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit-fix-preview.json'); console.log(JSON.stringify({added:a.added,removed:a.removed,changed:a.changed,audit:a.audit?.metadata?.vulnerabilities,stderr:a.error},null,2))"
      - name: TypeScript check
        run: npm run lint

      - name: Production web build
        run: npm run build

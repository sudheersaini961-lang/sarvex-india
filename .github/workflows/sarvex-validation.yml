name: SARVEX Branch Validation

on:
  push:
    branches:
      - fix/public-seller-sync-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sarvex-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production web build
        run: npm run build

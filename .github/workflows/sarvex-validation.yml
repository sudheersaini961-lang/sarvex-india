name: SARVEX Branch Validation

on:
  push:
    branches:
      - fix/public-seller-sync-security
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sarvex-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile after dependency classification
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency security advisories
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))"
      - name: Enforce full dependency security audit
        run: npm audit --audit-level=high

      - name: Inspect production dependency path to Vite advisories
        run: npm ls vite fdir picomatch --omit=dev || true

      - name: Enforce production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: sarvex-patched-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2

      - name: TypeScript check
        run: npm run lint

      - name: Production web build
        run: npm run build

      - name: Commit regenerated lockfile on safe branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/public-seller-sync-security'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Regenerate lockfile after moving build tooling to dev dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Lockfile already matches package.json."
          fi

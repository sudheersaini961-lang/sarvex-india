name: Build SARVEX Android Debug APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/public-seller-sync-security

jobs:
  build-android-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install locked npm dependencies
        run: npm ci

      - name: Run TypeScript lint check
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify no backup ZIPs are bundled
        run: |
          if find dist android/app/src/main/assets/public -type f -name "*.zip" | grep -q .; then
            echo "Error: Backup ZIP files found in web or Android bundle."
            exit 1
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: sarvex-india-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
